[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linux-diag-agent"
version = "0.1.0"
description = "Offline-first Linux kernel fault diagnosis agent — OLK v6.6 + v5.10"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Neo4j
    "neo4j>=5.20",
    # HTTP
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # OpenAI-compat (vllm / ollama / openai_compat providers)
    "openai>=1.30",
    # Anthropic SDK (anthropic provider + future agent_sdk adapter)
    "anthropic>=0.28",
    # MCP HTTP transport (CodeGraph client)
    "mcp>=1.3",
    # Async + concurrency
    "anyio>=4.4",
    "tenacity>=8.3",
    # CLI
    "click>=8.1",
    "rich>=13.7",
    # Utilities
    "python-dateutil>=2.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-python-dateutil",
]
ingest = [
    # lkml mbox download
    "requests>=2.32",
    # bugzilla
    "python-bugzilla>=3.2",
    # git operations
    "gitpython>=3.1",
]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
]

[project.scripts]
diag-agent = "cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = [
    "llm",
    "storage",
    "ingest",
    "retrieval",
    "graph",
    "agent",
    "mcp_servers",
    "clients",
    "cli",
    "configs",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PTH", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "docs/*", "data/*", "scripts/*"]
