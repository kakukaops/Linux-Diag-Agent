services:
  postgres:
    image: postgres:15-alpine
    container_name: diag-pg
    environment:
      POSTGRES_USER: diag
      POSTGRES_PASSWORD: diag_dev
      POSTGRES_DB: diag_agent
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diag -d diag_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: diag-neo4j
    environment:
      NEO4J_AUTH: neo4j/diag_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
